server:
  port: 8090

spring:
  application:
    name: home-material
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false

# Knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /api/**,/admin/**
      display-name: 家装选材避坑助手 API

# 微信小程序登录配置（生产通过环境变量覆盖）
wx:
  login:
    mock: true
    appid: your-appid
    secret: your-secret

# AI 大模型配置（硅基流动 OpenAI 兼容网关，默认 Mock；生产通过环境变量覆盖）
ai:
  mock: true
  base-url: https://api.siliconflow.cn/v1
  chat-path: /chat/completions
  api-key: ${AI_API_KEY:your-siliconflow-key}
  model: ${AI_MODEL:zhipuai/glm-4.5}
  timeout: 60000
  web-search: true
  temperature: 0.7
  default-city: 全国
  preload-category-ids: [10, 13, 16]
