spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/home_material?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

# 生产环境：微信登录走真实 code2session，敏感信息全部来自环境变量
wx:
  login:
    mock: ${WX_LOGIN_MOCK:false}
    appid: ${WX_APPID:}
    secret: ${WX_SECRET:}

logging:
  level:
    com.hirain.material: info
    root: warn
  file:
    name: logs/home-material.log
